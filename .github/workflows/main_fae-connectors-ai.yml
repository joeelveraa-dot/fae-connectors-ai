name: Build and deploy Python app to Azure Web App - fae-connectors-ai

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pre-descargar pesos del modelo CLIP
        run: |
          mkdir -p model_weights
          curl -fL --retry 3 -o model_weights/open_clip_model.safetensors \
            "https://huggingface.co/laion/CLIP-ViT-B-32-laion2B-s34B-b79K/resolve/main/open_clip_model.safetensors"

      - name: Create deployment package
        run: |
          zip -r release.zip . \
            -x "*.git*" \
            -x "*__pycache__*" \
            -x "*.venv*" \
            -x "*img_cache*" \
            -x "*.bin" \
            -x "*.cache" \
            -x "catalogo_conectores_completo.backup_*.xlsx" \
            -x "catalogo_meta.backup*.pkl" \
            -x "embeddings_b.backup*.npz" \
            -x "conector_prueba.jpg" \
            -x "test_img.png"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'fae-connectors-ai'
          slot-name: 'Production'
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A52824EF3E604753B40A2C1887CCA3E3 }}